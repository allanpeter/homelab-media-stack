name: homelab-media-stack

services:
  init:
    image: alpine:3.21
    container_name: homelab-media-init
    command: >-
      /bin/sh -ec 'mkdir -p /config/jellyfin /config/qbittorrent/qBittorrent
      /config/prowlarr /config/sonarr /config/radarr /media/downloads/incomplete
      /media/movies /media/tv;
      if [ ! -f /config/qbittorrent/qBittorrent/qBittorrent.conf ]; then
      cp /defaults/qbittorrent.conf /config/qbittorrent/qBittorrent/qBittorrent.conf;
      fi;
      if [ ! -f /config/sonarr/config.xml ]; then
      cp /defaults/arr-config.xml /config/sonarr/config.xml;
      fi;
      if [ ! -f /config/radarr/config.xml ]; then
      cp /defaults/arr-config.xml /config/radarr/config.xml;
      fi;
      if [ ! -f /config/prowlarr/config.xml ]; then
      cp /defaults/prowlarr-config.xml /config/prowlarr/config.xml;
      fi;
      chown -R ${PUID:-1000}:${PGID:-1000} /config /media'
    volumes:
      - ./config:/config
      - ./media:/media
      - ./defaults/qbittorrent.conf:/defaults/qbittorrent.conf:ro
      - ./defaults/arr-config.xml:/defaults/arr-config.xml:ro
      - ./defaults/prowlarr-config.xml:/defaults/prowlarr-config.xml:ro
    restart: "no"

  dashboard:
    image: nginx:1.27-alpine
    container_name: homelab-media-dashboard
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
      NGINX_ENVSUBST_FILTER: "_PORT$$"
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      QBITTORRENT_PORT: ${QBITTORRENT_PORT:-8080}
      PROWLARR_PORT: ${PROWLARR_PORT:-9696}
      SONARR_PORT: ${SONARR_PORT:-8989}
      RADARR_PORT: ${RADARR_PORT:-7878}
    volumes:
      - ./dashboard/index.html:/etc/nginx/templates/index.html.template:ro
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:8000:80"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: homelab-media-jellyfin
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./config/jellyfin:/config
      - ./media:/data:ro
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${JELLYFIN_PORT:-8096}:8096"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: homelab-media-qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
      WEBUI_PORT: 8080
    volumes:
      - ./config/qbittorrent:/config
      - ./media:/data
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${QBITTORRENT_PORT:-8080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: homelab-media-prowlarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${PROWLARR_PORT:-9696}:9696"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: homelab-media-sonarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./config/sonarr:/config
      - ./media:/data
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${SONARR_PORT:-8989}:8989"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: homelab-media-radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./config/radarr:/config
      - ./media:/data
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${RADARR_PORT:-7878}:7878"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
