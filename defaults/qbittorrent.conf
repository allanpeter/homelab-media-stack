[AutoRun]
enabled=false
program=

[LegalNotice]
Accepted=true

[Preferences]
Connection\UPnP=false
Connection\PortRangeMin=6881
Downloads\SavePath=/data/downloads/
Downloads\TempPath=/data/downloads/incomplete/
Downloads\ScanDirsV2=@Variant(\0\0\0\x1c\0\0\0\0)
WebUI\Address=*
WebUI\ServerDomains=*
# O dashboard roda na porta 8000 e o qBittorrent na 8080. Como a proteção CSRF do
# qBittorrent compara o header Referer com a própria origem, um link entre portas
# diferentes é sempre recusado com uma página "Unauthorized". Neste laboratório as
# UIs só escutam em localhost/LAN, então desligamos a checagem para os links do
# dashboard funcionarem. Se você expuser esta UI para fora, volte para `true`.
WebUI\CSRFProtection=false

# Credenciais do laboratório: admin / 1234
#
# Sem uma senha definida aqui, o qBittorrent sorteia uma senha nova a cada boot e
# só a mostra no log do container. O hash abaixo é PBKDF2-HMAC-SHA512, 100000
# iterações, no formato base64(salt):base64(chave) que o qBittorrent espera.
#
# `1234` é uma senha fraca e está versionada neste repositório: só use enquanto a
# UI estiver restrita a localhost/LAN de confiança. A própria UI do qBittorrent
# exige 6+ caracteres, então trocar por aqui é o único jeito de deixá-la tão curta.
WebUI\Username=admin
WebUI\Password_PBKDF2="@ByteArray(Al0+K3arSm3g6TZSU1KKcw==:v/98YpoSq4Fm9Onl7xgE0my7AmP8Eo0CGageWKA/vixnJ03A5342SWf0z/sLmECSvQZ8dk5DTTmm4ithHMUM0Q==)"

# Alternativa sem senha nenhuma: descomente para dispensar login em quem vem do
# próprio host, ou de uma faixa da sua LAN. Ajuste a faixa para a sua rede real —
# deixar uma faixa ampla aqui é o mesmo que deixar a UI aberta para ela.
#WebUI\LocalHostAuth=false
#WebUI\AuthSubnetWhitelistEnabled=true
#WebUI\AuthSubnetWhitelist=192.168.0.0/24
